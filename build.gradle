plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nosulkora'
version = '1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'io.minio:minio:8.6.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'


	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')

	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:minio'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Принудительное разрешение конфликта версий для Testcontainers и MinIO
configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-compress') {
			details.useVersion '1.27.1' // Свежая стабильная версия без багов
			details.because 'Fix TarArchiveEntry.java:391 NoSuchMethodError in Testcontainers'
		}
		if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
			details.useVersion '3.17.0' // Соответствующая ей версия lang3, необходимая TarArchiveEntry
			details.because 'Required by commons-compress 1.27.1'
		}
	}
}