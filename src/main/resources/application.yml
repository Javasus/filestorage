spring:
  datasource:
    url: jdbc:mysql://localhost:3307/filestorage
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update #validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: filestorage

jwt:
  secret: "your-super-secret-key-that-must-be-at-least-32-characters-long"
  expiration: 3600000 # 1 час в миллисекундах

logging:
  level:
    root: INFO
    com.nosulkora.filestorage: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/filestorage.log
    max-size: 10MB
    max-history: 30

springdoc:
  swagger-ui:
    # Отключает проверку обновлений и внешние валидаторы
    validator-url: none
  # Заставляет генерировать JSON-спецификацию локально
  api-docs:
    enabled: true